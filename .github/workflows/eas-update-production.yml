name: EAS Update (production)

# Publishes an over-the-air update to every installed build subscribed to
# the "production" channel whenever frontend code lands on main — no app
# store re-submission needed for JS/asset-only changes. Native changes
# (new native modules, permissions, etc.) still need a real EAS Build +
# store release, since an OTA update can't touch the native binary.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN secret — create one at https://expo.dev/accounts/[account]/settings/access-tokens and add it as a repo secret. See https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: |
          eas update \
            --channel production \
            --environment production \
            --non-interactive \
            -m "${{ github.event.head_commit.message }}"
