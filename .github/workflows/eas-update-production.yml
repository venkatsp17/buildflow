name: EAS Update (production)

# Publishes an over-the-air update to installed production builds and to the
# preview-channel internal build currently distributed to testers whenever
# frontend code lands on main. Native changes still need a real EAS Build.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-update-production.yml'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN secret — create one at https://expo.dev/accounts/[account]/settings/access-tokens and add it as a repo secret. See https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish production update
        run: |
          eas update \
            --channel production \
            --environment production \
            --non-interactive \
            -m "${{ github.event.head_commit.message }}"

      - name: Publish preview update
        run: |
          eas update \
            --channel preview \
            --environment production \
            --non-interactive \
            -m "${{ github.event.head_commit.message }}"
